# Runs `npm run verify` on every push and pull request: syntax check, unit tests, the fingerprinted build, a Worker
# bundle dry-run and the Playwright end-to-end suite (public flow, crew flow, screenshots, axe) against a fully mocked
# API — nothing here reaches the production Worker, D1, R2, Cashfree or the face service. `npm run lighthouse` stays
# out on purpose: it needs network access to the production Worker for the landing page's session list.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 11 may print an "allow-scripts" notice for esbuild/workerd install scripts; wrangler still bundles (W1-E).
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Decided before anything runs, so the baseline hand-back below still fires after it has written the files.
      - id: baselines
        run: echo "linux=$(ls tests/e2e/__screenshots__/screenshots.spec.mjs/*-linux.png 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # check → test → build → wrangler dry-run → e2e. Screenshot comparisons run only once Linux baselines are
      # committed (tests/e2e/__screenshots__/**/*-linux.png); until then the config skips them and says so.
      - run: npm run verify

      - name: Upload the Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # First run on Linux: hand back a baseline set the team can commit to switch the visual comparison on.
      - name: Generate Linux screenshot baselines when none are committed
        if: success() && steps.baselines.outputs.linux == '0'
        run: npx playwright test tests/e2e/screenshots.spec.mjs --update-snapshots

      - name: Upload the Linux baselines
        if: success() && steps.baselines.outputs.linux == '0'
        uses: actions/upload-artifact@v4
        with:
          name: linux-screenshot-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore
          retention-days: 30
